name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: evalrepo_backend/evalrepo
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: evalrepo_backend/evalrepo
        run: pytest --cov=. --cov-report=xml:coverage.xml
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=samuelanyoneai
            -Dsonar.projectKey=samuelanyoneai_MAS
            -Dsonar.sources=evalrepo_backend/evalrepo,evalrepo-frontend/evalrepo-frontend/src
            -Dsonar.python.coverage.reportPaths=evalrepo_backend/evalrepo/coverage.xml
